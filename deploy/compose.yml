name: nyc-tlc # project name -> volume becomes "nyc-tlc_prefect", whatever the folder is called.

services:
  prefect-server:
    image: prefecthq/prefect:3.8.8-python3.13 # must match with `prefect` in `uv.lock`
    command: prefect server start
    environment:
      PREFECT_HOME: /var/lib/prefect # server state (SQLite) goes here -> on the volume
      PREFECT_SERVER_API_HOST: 0.0.0.0 # Listen to other containers, not only itself
      PREFECT_SERVER_UI_API_URL: http://localhost:4200/api # address the *browser on Mac* uses (via ssh -L)
    volumes:
      - prefect:/var/lib/prefect # plug volume "prefect" in at PREFECT_HOME
    ports:
      - "127.0.0.1:4200:4200" # labby loopback only; quoted so YAML keeps it a string
    healthcheck:
      # Run INSIDE this container; image has python, not curl
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)",
        ]
      interval: 10s # Check every 10s
      timeout: 5s # one check fails if it takes longer than this
      retries: 5 # 5 failures in a row -> 'unhealthy'
      start_period: 30s # failures during startup don't count
    restart: unless-stopped # comes back after a labby reboot, unless you stopped it manually

  pipeline:
    image: ghcr.io/kevinseek/nyc-tlc-pipeline:${IMAGE_TAG:?IMAGE_TAG must be set in .env} # main by default; pin a SHA to roll back
    command: ["nyc-tlc-smoke"] # overrides the image CMD (nyc-tlc-pipeline --help)
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api # service name resolves via Compose DNS; container IPs change on recreate
    volumes:
      - nyc_tlc_pipeline:/data # empty named volume copies /data and its app:app ownership from the image on first mount
    depends_on:
      prefect-server:
        condition: service_healthy # wait for the healthcheck to pass, not just for the container to start
    profiles: [manual] # skipped by `up -d`; started only when named: `docker compose run --rm pipeline`
    restart: "no" # one-off job: exits 0 or 1 and stays exited; quoted because bare no is a YAML boolean

volumes:
  prefect: # declared here, empty value
  nyc_tlc_pipeline: # DuckDB + raw files; full name on labby: nyc-tlc_nyc_tlc_pipeline
