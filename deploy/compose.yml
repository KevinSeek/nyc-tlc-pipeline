# Name of the project
# * Fragile; If omitted: name of the folder containing this file (e.g. on homelab: `/opt/nyc-tlc` → nyc-tlc)
name: nyc-tlc

services:
  prefect-server:
    # must match with `prefect` in `uv.lock`; server image runs its own python ver. separate from project.
    image: prefecthq/prefect:3.8.8-python3.14
    # # replaces the image's CMD (ENTRYPOINT unchanged); starts the API + UI
    command: prefect server start
