# Name of the workflow which GitHub display under repo's "Actions"
name: CI

# Control when the workflow will run
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

## Workflow-level (Available to all jobs)

# Grant read access to content scope only. Every scope left out becomes `none`
permissions:
  contents: read

# Set environment variables
env:
  # image path strictly lowercase due to OCI distribution spec; must match deploy/compose.yml
  IMAGE: "ghcr.io/kevinseek/nyc-tlc-pipeline"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Install uv"
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Install a specific version of uv; pinned to the same version in docker image
          version: "0.13.1"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  publish:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
